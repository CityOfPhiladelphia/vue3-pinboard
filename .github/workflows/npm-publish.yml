# Publishes @phila/pinboard to npm via OIDC trusted publishing when a tag is pushed.
#
# npmjs.com (package Settings > Trusted Publisher) trusts THIS repository and
# THIS workflow filename; the job exchanges a GitHub OIDC token for a
# short-lived npm credential at publish time. No npm token is stored anywhere.

name: Publish to npmjs

on:
  push:
    tags:
      - '*'

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies
        run: |
          printf "@fortawesome:registry=https://npm.fontawesome.com/\n//npm.fontawesome.com/:_authToken=${FONTAWESOME_NPM_AUTH_TOKEN}" >> ~/.npmrc
          npm ci
          npm run build:production
        env:
          FONTAWESOME_NPM_AUTH_TOKEN: ${{ secrets.FA_AUTH_TOKEN }}
          VITE_CYCLOMEDIA_API_KEY: ${{ secrets.VITE_CYCLOMEDIA_API_KEY }}
          VITE_CYCLOMEDIA_PASSWORD: ${{ secrets.VITE_CYCLOMEDIA_PASSWORD }}
          VITE_CYCLOMEDIA_USERNAME: ${{ secrets.VITE_CYCLOMEDIA_USERNAME }}
          VITE_AGO_USERNAME: ${{ secrets.VITE_AGO_USERNAME }}
          VITE_AGO_PASSWORD: ${{ secrets.VITE_AGO_PASSWORD }}
          VITE_DEBUG: ${{ secrets.VITE_DEBUG }}

      # Trusted publishing needs npm 11.5.1+; pin the floor so a runner image
      # change can't regress it.
      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@latest && npm --version

      # Provenance is attached automatically under trusted publishing.
      - name: Publish to npm
        run: |
          npm publish --access public
